<style>

/* Shared window chrome, paper panels and the book's green binding. */
:root{--ink:#22382f;--deep:#173d32;--line:#d2dad1;--paper:#fbfcf8;--accent:#347456}
body{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.appbar{height:48px;min-height:48px;padding:0 0 0 16px;gap:12px;background:var(--deep);color:#f8f4df;border:0;user-select:none}
#dragTitle{align-self:stretch;display:flex;flex:1;align-items:center;gap:10px;min-width:110px}
#dragTitle strong{font-size:22px}#dragTitle span{color:#cad7ca;border-color:#627b6d;font-size:12px}
.appbar nav,.windowButtons{display:flex;align-items:center}.appbar button{background:transparent;border:0;color:#e2eadf;padding:7px 10px;font-size:12px;font-weight:500}
.appbar button:hover{background:#345447;color:white}.appbar button:focus-visible{outline-color:#d7e2b9;outline-offset:-3px}

.windowButtons{border-left:1px solid #547060;height:100%;padding-left:8px;gap:5px}
.windowButtons button{border:0;border-radius:5px;width:36px;height:32px;padding:0;display:grid;place-items:center;color:#dce9df;background:#ffffff0b}
.windowButtons button:hover{background:#ffffff20}
.windowButtons #closeWindow:hover{background:#c13d48;color:white}
.windowButtons svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.55;fill:none;stroke-linecap:round;stroke-linejoin:round}
.windowButtons #maxWindow svg{width:13px;height:13px}
.exportSettings{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:12px;border-top:1px solid #cdd5ca}
.exportSettings button{padding:5px 7px;font-size:12px}.exportFolder{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#56665a;font-size:12px}

.shell{min-height:0;flex:1}.work{min-height:0;overflow:auto;gap:16px;padding:22px clamp(20px,3vw,40px) 18px;background:var(--paper)}
aside{overflow:auto;background:#eef2eb}.poster{border:1px solid #d5ded2;background:#e1e8db;min-height:180px;margin-bottom:10px}

h1{font-size:29px;letter-spacing:.04em}.origin{padding:15px 18px}.toc{min-height:120px;overflow:hidden}.bar{gap:8px}.rows{min-height:0;max-height:none;overflow:auto;scrollbar-gutter:stable}
.row{min-height:43px;padding:4px 8px}.row:hover{background:#edf2eb}.row button{opacity:.7}.row:hover button,.row:focus-within button{opacity:1}
button{transition:background-color .15s,color .15s,transform .12s}button:active:enabled{transform:translateY(1px)}
.bottom{flex-shrink:0}.bottom>div:first-child{min-width:0}.status{line-height:1.4;max-height:52px;overflow:auto}
#release{background:#e5eee4;padding:9px 22px;flex:none;border-bottom:1px solid var(--line)}#release .bar{padding:0;border:0}
#releaseMeter,.meter>div{display:flex;align-items:center;gap:12px;justify-content:space-between}
.meter{padding:10px 14px;background:#edf3ea;border:1px solid var(--line);border-radius:5px;flex:none}
.meter strong,output{font-size:12px}output{color:#405d4d;font-variant-numeric:tabular-nums;white-space:nowrap}

progress::-webkit-progress-bar{background:#d4dfd0}progress::-webkit-progress-value{background:var(--accent);transition:width .22s linear}
progress:indeterminate{background:#acc4ad;animation:pulse 1.2s ease-in-out infinite alternate}
progress:indeterminate::-webkit-progress-bar{background:#acc4ad}

dialog[open],.meter:not([hidden]),#release:not([hidden]),.work,.rows.fresh{animation:appear .2s ease-out}
[hidden]{display:none!important}
.edge{position:fixed;z-index:20}.edge.n,.edge.s{height:4px;left:6px;right:6px;cursor:ns-resize}.edge.n{top:0}.edge.s{bottom:0}
.edge.e,.edge.w{width:4px;top:6px;bottom:6px;cursor:ew-resize}.edge.e{right:0}.edge.w{left:0}
.edge.nw,.edge.ne,.edge.sw,.edge.se{width:7px;height:7px}.nw,.ne{top:0}.sw,.se{bottom:0}.nw,.sw{left:0}.ne,.se{right:0}
.edge.nw,.edge.se{cursor:nwse-resize}.edge.ne,.edge.sw{cursor:nesw-resize}body.maximized .edge{display:none}
@media(max-height:680px){.work{gap:10px;padding-top:14px}.origin{padding:10px 14px}.poster{min-height:120px;padding:8px}.poster canvas{max-height:135px;width:auto}.meta{margin-top:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
#binding{position:fixed;inset:48px 0 0;z-index:8;overflow:hidden;background:radial-gradient(ellipse at 43% 28%,#547466,#294c41 51%,#142f28);color:#fff9e8}
#binding[hidden]{display:none}
#bindCanvas{display:block;width:100%;height:100%;max-width:none;box-shadow:none;background:transparent}

.bindingFooter strong{font:600 20px Georgia,"Microsoft YaHei UI",serif;font-variant-numeric:tabular-nums}
#bindPhase{grid-column:1;font-size:13px;color:#d9e6dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bindCancel{grid-column:2;grid-row:1/3;color:#fff9e8;background:transparent;border-color:#91a99a}
body.binding #cover{visibility:hidden}
</style>
<header class="appbar">
  <div id="dragTitle" class="pywebview-drag-region"><img alt="" width="32" height="32" draggable="false" src="data:image/x-icon;base64,__APP_ICON__"><strong>拾卷</strong><span>网页小说制书工具</span></div>
  <nav aria-label="应用工具"><button id="plugins">插件目录</button><button id="install" disabled>安装插件</button><button id="update" disabled>检查更新</button></nav>
  <div class="windowButtons"><button id="minWindow" title="最小化" aria-label="最小化"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg></button><button id="maxWindow" title="最大化" aria-label="最大化"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.25" y="3.25" width="9.5" height="9.5" rx="1.2"/></svg></button><button id="closeWindow" title="关闭窗口" aria-label="关闭窗口"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></div>
</header>
<div id="release" hidden><div class="bar"><span id="releaseText" role="status"></span><div><button id="getRelease" hidden>下载并打开安装向导</button><button class="plain" id="dismissRelease">关闭</button></div></div><div id="releaseMeter" hidden><progress aria-label="安装包下载进度" id="releaseBar"></progress><output id="releaseNumbers"></output></div></div><div class="shell"><aside><h2>书籍预览</h2><div class="poster"><canvas id="cover" width="540" height="756" aria-label="电子书封面预览"></canvas></div><span id="coverLabel">排版封面</span><div class="exportSettings"><span class="exportFolder" id="exportFolder">每次选择保存位置</span><button class="plain" id="setExportFolder">设置导出文件夹…</button></div><div class="coverTools"><button class="plain" id="uploadCover">选择图片…</button><button class="plain" id="resetCover" hidden>恢复默认</button></div><input hidden type="file" id="imageFile" accept="image/jpeg,image/png,image/webp"><label class="field" for="title">书名</label><input type="text" id="title" maxlength="180" placeholder="解析后自动填写"><label class="field" for="author">作者</label><input type="text" id="author" maxlength="120" placeholder="可选"><div class="meta"><span>电子书格式</span><b>EPUB 3</b></div></aside>
<main class="work"><h1>制书工作台</h1><form class="origin" id="form"><label for="url">小说网页</label><div class="urlrow"><input type="url" id="url" placeholder="https://…" required><button class="primary" id="inspect" disabled>解析网页</button></div><p class="hint">粘贴小说目录或正文网址。 <button class="example" type="button" id="esjLogin" hidden>登录 ESJ Zone</button></p><div id="unsupported" hidden role="alert" style="margin-top:12px"><strong id="reason"></strong> <button type="button" id="installHere">安装对应插件…</button></div></form>
<section class="toc"><div class="bar"><h2>章节目录</h2><div><button class="plain" id="renameMany" disabled>批量改名…</button><button class="plain" id="all" disabled>全选</button><button class="plain" id="none" disabled>清空选择</button></div></div><div class="rows" id="rows"><div class="empty"><svg width="58" height="35" viewBox="0 0 58 35" fill="none" stroke="#6b8776" stroke-width="1.7" aria-hidden="true"><path d="M3 6q14-4 25 3 12-7 26-3v23q-14-4-26 2-12-6-25-2zM28 9v21M7 2q11-2 20 3m5 0q10-5 19-3"/></svg><strong>等待导入章节</strong><span class="small">解析网页后，在这里选择要收录的章节。</span></div></div></section>
<div class="meter" id="bookMeter" hidden><div><strong id="progressPhase">正在下载章节</strong><output id="progressNumber"></output></div><progress id="progress" aria-label="章节下载进度"></progress></div><div class="bottom"><div><strong id="count">已选 0 章</strong><div class="status" role="status" id="status"></div></div><div class="actions"><button id="cancel" hidden>取消</button><button id="export" class="primary" disabled>导出 EPUB ↓</button></div></div></main></div>
<dialog id="renameBox"><h2 id="renameHeading"></h2>
<div id="modeRow"><label class="field" for="renameMode">改名方式</label><select id="renameMode"><option value="text">文字替换</option><option value="regex">正则替换</option><option value="format">按模板命名</option></select></div>
<div id="searchRow"><label class="field" for="nameSearch">查找</label><input type="text" id="nameSearch"></div>
<label class="field" id="replaceLabel" for="nameReplace">替换为</label><input type="text" id="nameReplace"><p class="hint" id="renameHint"></p>

<div id="binding" hidden role="dialog" aria-label="正在装订电子书"><canvas id="bindCanvas" aria-hidden="true"></canvas><div class="bindingFooter"><strong id="bindCount"></strong><span id="bindPhase" role="status"></span><button id="bindCancel">取消导出</button></div></div>
<script>
const el=id=>document.getElementById(id), ttl=el('title'), auth=el('author'), url=el('url'), cv=el('cover');
let book=null,busy=false,chosen=new Set(),ready=false,loadedUrl='';
let coverImage=null, siteImage=null;
async function imageFrom(src){
 const image=new Image();image.src=src;await image.decode();
 if(!image.naturalWidth||!image.naturalHeight)throw Error('无法读取封面图片。');
 return image;
}
function setCover(image,label){
 coverImage=image;el('coverLabel').textContent=label;el('resetCover').hidden=image===siteImage;
 cover();
}
function cover(){
 if(coverImage){
  const ratio=Math.min(1,1600/Math.max(coverImage.naturalWidth,coverImage.naturalHeight));
  cv.width=Math.max(1,Math.round(coverImage.naturalWidth*ratio));cv.height=Math.max(1,Math.round(coverImage.naturalHeight*ratio));
  cv.getContext('2d').drawImage(coverImage,0,0,cv.width,cv.height);return;
 }
 cv.width=540;cv.height=756;
 const c=cv.getContext('2d'),w=cv.width,h=cv.height;c.fillStyle='#193f35';c.fillRect(0,0,w,h);
 c.strokeStyle='#90aa89';c.lineWidth=2;c.strokeRect(20,18,w-38,h-36);
 c.fillStyle='#112f27';c.fillRect(0,0,12,h);c.save();c.beginPath();c.rect(23,23,494,709);c.clip();
 c.fillStyle='#cfb77b';c.beginPath();c.arc(404,357,34,0,7);c.fill();
 for(let j=0;j<64;j++){c.beginPath();for(let x=0;x<=w;x+=3){let y=465+j*4.5+40*Math.sin(x/109+j*.047)+17*Math.cos(x/57-j*.03)+8*Math.sin(x/30+j*.016);if(x===0)c.moveTo(x,y);else c.lineTo(x,y)}c.strokeStyle=j%5===0?'#a2ad82':'#71947d';c.lineWidth=j%5===0?2:1.5;c.stroke()}c.restore();
 c.fillStyle='#f3edce';const name=ttl.value.trim()||'未题书稿';const letters=Array.from(name);const size=letters.length>13?41:57;c.font='bold '+size+'px SimSun,serif';let words='',y=123;
 for(const ch of letters){if(c.measureText(words+ch).width>422){c.fillText(words,50,y);words='';y+=size*1.23;if(y>285){words='…';break}}words+=ch}c.fillText(words,50,y);
 c.fillStyle='#d4dfc6';c.font='24px SimSun,serif';c.fillText(auth.value.trim()||'佚名',52,Math.min(y+65,363),405);
}
el('uploadCover').onclick=()=>el('imageFile').click();
el('resetCover').onclick=()=>setCover(siteImage,siteImage?'网站封面':'排版封面');
el('imageFile').onchange=async()=>{
 const input=el('imageFile'),file=input.files[0];input.value='';if(!file)return;
 if(file.size>12*1024*1024){msg('请选择小于 12 MB 的封面图片。',true);return}
 const objectUrl=URL.createObjectURL(file);busy=true;sync();
 try{setCover(await imageFrom(objectUrl),'自选封面')}catch{msg('图片无法读取，请选择 JPG、PNG 或 WebP。',true)}
 finally{URL.revokeObjectURL(objectUrl);busy=false;sync()}
};
el('setExportFolder').onclick=async()=>{
 try{const result=await pywebview.api.choose_export_folder();
  if(result.error)throw Error(result.error);
  if(result.path)el('exportFolder').textContent=result.path;
 }catch(err){msg(err.message,true)}
};
el('esjLogin').onclick=async()=>{try{await pywebview.api.esj_login()}catch(e){msg(e.message,true)}};
function msg(s='',error=false){el('status').textContent=s;el('status').classList.toggle('error',error)}
const initialRows=el("rows").innerHTML;
function sync(){el("install").disabled=busy||!ready;el("installHere").disabled=busy||!ready;let valid=book&&url.value.trim()===loadedUrl;
 let esj=false;try{esj=['esjzone.cc','www.esjzone.cc'].includes(new URL(url.value).hostname)}catch{}
 el('esjLogin').hidden=!esj;el('esjLogin').disabled=busy||!ready;
 el('renameMany').disabled=busy||!valid||!chosen.size;
 el('uploadCover').disabled=busy||!valid;el('resetCover').disabled=busy||!valid;
 if(!busy&&el('bookMeter').dataset.selection!==[...chosen].join(','))el('bookMeter').hidden=true;
 el('bookMeter').dataset.selection=[...chosen].join(',');
 el('count').textContent=book?'已选 '+chosen.size+' / '+book.chapters.length+' 章':'已选 0 章';
 el('export').disabled=busy||!valid||!chosen.size||!ttl.value.trim();el('inspect').disabled=busy||!ready;
 for(const key of ['all','none'])el(key).disabled=busy||!valid;
 for(const box of [ttl,auth,url])box.disabled=busy;el('rows').inert=busy||!valid;
}
function render(){
 const frag=document.createDocumentFragment();
 book.chapters.forEach((ch,i)=>{
  const row=document.createElement('div'),label=document.createElement('label'),cb=document.createElement('input');
  row.className='row';cb.type='checkbox';cb.checked=chosen.has(i);cb.disabled=!!ch.locked;
  cb.onchange=()=>{cb.checked?chosen.add(i):chosen.delete(i);sync()};
  const no=document.createElement('small'),name=document.createElement('span'),edit=document.createElement('button');
  no.className='num';no.textContent=String(i+1).padStart(2,'0');name.textContent=ch.name;
  if(ch.locked){const badge=document.createElement('small');badge.textContent='VIP';badge.title='该章节标记为站点付费章节';badge.style.cssText='margin-left:8px;padding:1px 6px;border-radius:8px;background:#f3e6d4;color:#8a5320;font-size:10px;flex:none';label.append(cb,no,name,badge)}else label.append(cb,no,name);
  edit.className='plain';edit.textContent='改名';edit.disabled=!!ch.locked;edit.onclick=()=>openRename(i);
  row.append(label,edit);frag.append(row)
 });el('rows').replaceChildren(frag);el('rows').classList.add('fresh');sync()
}
let editIndex=null, planned=[];
function openRename(index){
 editIndex=index;const single=index!==null;
 el('renameHeading').textContent=single?'修改章节名':'批量改名 · 已选 '+chosen.size+' 章';
 el('modeRow').hidden=single;el('nameSearch').value='';el('renameMode').value='text';
 el('nameReplace').value=single?book.chapters[index].name:'';
 previewNames();el('renameBox').showModal();(single?el('nameReplace'):el('nameSearch')).focus()
}
function previewNames(){
 const single=editIndex!==null,mode=el('renameMode').value,find=el('nameSearch').value,repl=el('nameReplace').value;
 el('searchRow').hidden=single||mode==='format';el('replaceLabel').textContent=single?'新章节名':mode==='format'?'命名模板':'替换为';
 el('renameHint').textContent=single?'':mode==='regex'?'使用 JavaScript 正则表达式，替换中可用 $1、$2 引用分组。':mode==='format'?'可用 {n} 表示所选顺序，{title} 表示当前标题。例如：第{n}章 {title}':'查找内容会在所选章节名中全部替换。';
 planned=[];let preview='';
 try{
  if(!single&&mode!=='format'&&!find)throw Error('输入要查找的内容。');
  const regex=!single&&mode==='regex'?new RegExp(find,'g'):null;
  const ids=single?[editIndex]:[...chosen].sort((a,b)=>a-b);
  ids.forEach((id,n)=>{
   const before=book.chapters[id].name;
   const after=(single?repl:regex?before.replace(regex,repl):mode==='format'?repl.replace(/\{(n|title)\}/g,(_,key)=>key==='n'?String(n+1):before):before.split(find).join(repl)).trim();
   if(!after)throw Error('结果包含空标题，请调整后再应用。');
   if(before!==after)planned.push({id,before,after})
  });
  preview=planned.length?'将修改 '+planned.length+' 章\n'+planned.slice(0,30).map(p=>p.before+' → '+p.after).join('\n')+(planned.length>30?'\n仅预览前 30 项。':''):'没有变化。';
 }catch(e){planned=[];preview=e.message}
 el('changes').textContent=preview;el('applyRename').disabled=!planned.length
}

function bookProgress(done,total,phase){
 const bar=el('progress');bar.max=total||1;
 if(total)bar.value=done;else bar.removeAttribute('value');
 el('progressPhase').textContent=phase;
 el('progressNumber').textContent=total?done+' / '+total+' 章 · '+Math.floor(100*done/total)+'%':'';
 el('bookMeter').hidden=false
}
function poll(read,paint){
 let active=true,waiting=false;
 const tick=async()=>{if(waiting)return;waiting=true;
  try{const value=await read();if(active)paint(value)}catch{}finally{waiting=false}};
 const timer=setInterval(tick,200);
 return ()=>{active=false;clearInterval(timer)}
}
function bindBook(total){
 const scene=el('binding'),canvas=el('bindCanvas'),ctx=canvas.getContext('2d');
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const names=[...chosen].sort((a,b)=>a-b).map(i=>book.chapters[i].name);
 const preview=cv.getBoundingClientRect();
 const shell=document.querySelector('.shell');
 scene.hidden=false;
 shell.inert=true;
 document.body.classList.add('binding');
 const cancel=el('bindCancel');
 cancel.disabled=false;
 cancel.onclick=()=>{cancel.disabled=true;el('cancel').click();el('bindPhase').textContent='正在取消…'};
 cancel.focus();
 el('bindPhase').textContent='正在读取章节';
 el('bindCount').textContent='0 / '+total+' 章';
 const textures=new Map();
 function paper(page){
  if(textures.has(page))return textures.get(page);
  const sheet=document.createElement('canvas');
  sheet.width=400;sheet.height=552;
  const ink=sheet.getContext('2d');
  const tint=ink.createLinearGradient(0,0,400,32);
  tint.addColorStop(0,'#dfd2b9');tint.addColorStop(.09,'#f6ecd8');tint.addColorStop(1,'#fff9ea');
  ink.fillStyle=tint;ink.fillRect(0,0,400,552);
  if(page>0){
   ink.fillStyle='#77674f';ink.font='16px Georgia';ink.fillText(String(page).padStart(2,'0'),45,58);
   ink.fillStyle='#393d31';ink.font='bold 26px SimSun,serif';
   let line='',y=115;
   for(const c of names[page-1]||''){
    if(ink.measureText(line+c).width>308){ink.fillText(line,45,y);y+=37;line='';if(y>240)break}
    line+=c;
   }
   ink.fillText(line,45,y);
   ink.fillStyle='#d4c9b5';
   for(let i=0;y+55+i*20<468;i++)ink.fillRect(45,y+55+i*20,i%5===4?197:302,1.6);
  }
  if(textures.size>8)textures.delete(textures.keys().next().value);
  textures.set(page,sheet);return sheet;
 }
 const started=performance.now();
 let collected=0,landed=0,next=0,phase='idle',since=started,raf,closing=0,sequence=0;
 const bounded=t=>Math.max(0,Math.min(1,t));
 const ease=t=>t*t*(3-2*t);
 const directions=[[1,-.75],[-1,.65],[-.28,-1],[.4,1],[-1,-.55],[1,.6],[0,1],[-1,0]];
 let w,h,scale,cx,cy;
 function project(x,y,z){
  const depth=1+z*.06;
  return [cx+scale*(x*.95+y*.15-z*.14)*depth,cy+scale*(y*.85-x*.12-z*.53)*depth];
 }
 // Map narrow strips of a printed page onto a bending surface, including the back.
 function drawSheet(texture,edge,shade=true){
  const strips=32;
  let a=edge(0,-.69),b=edge(0,.69);
  for(let i=0;i<strips;i++){
   const u=(i+1)/strips,c=edge(u,-.69),d=edge(u,.69);
   const dx=c[0]-a[0],dy=c[1]-a[1],vx=b[0]-a[0],vy=b[1]-a[1];
   const det=dx*vy-dy*vx;
   if(Math.abs(det)>.01){
    ctx.save();
    ctx.transform(dx,dy,vx,vy,a[0],a[1]);
    if(det>0)ctx.drawImage(texture,i*texture.width/strips,0,texture.width/strips,texture.height,0,0,1.12,1);
    else{ctx.fillStyle='#efe4cc';ctx.fillRect(0,0,1.12,1)}
    if(shade){
     const light=Math.min(.23,Math.abs(dy)/(Math.abs(dx)+Math.abs(dy)+.01)*.25);
     ctx.fillStyle='rgba(80,66,44,'+light+')';ctx.fillRect(0,0,1.12,1);
    }
    ctx.restore();
   }
   a=c;b=d;
  }
 }
 function frame(now){
  const rect=canvas.getBoundingClientRect();
  w=rect.width;h=rect.height;
  const ratio=Math.min(devicePixelRatio||1,2);
  if(canvas.width!==Math.round(w*ratio)||canvas.height!==Math.round(h*ratio)){
   canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);
  }
  ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);
  scale=Math.min(w*.335,h*.405,355);
  cx=w*.50;cy=h*.44;
  const ground=ctx.createRadialGradient(0,0,0,0,0,1);
  ground.addColorStop(0,'#0b201aca');ground.addColorStop(1,'#0b201a00');
  ctx.save();ctx.translate(cx,cy+scale*.76);ctx.scale(scale*1.15,scale*.18);
  ctx.fillStyle=ground;ctx.fillRect(-1,-1,2,2);ctx.restore();
  const age=now-started;
  const fly=reduced?1:ease(bounded(age/510));
  const close=closing?ease(bounded((now-closing)/530)):0;
  const travel=closing?ease(bounded((now-closing-530)/340)):1-fly;
  const open=reduced?1:ease(bounded((age-350)/620))*(1-close);
  cy+=reduced?0:Math.sin(age/1050)*5;

  scale+=(preview.width-scale)*travel;
  cx+=(preview.left-cx)*travel;cy+=(preview.top-rect.top+preview.height/2-cy)*travel;
  function flat(texture,side,z){
   drawSheet(texture,(u,y)=>project(side<0?u-1:u,y,z),false);
  }
  // A cloth cover and a few exposed leaves give the floating book a visible fore edge.
  const sides=open>.95?[-1,1]:[1];
  for(const side of sides){
   for(const [z,color,margin] of [[-.079,'#193c32',.025],[-.062,'#ad9d81',.008],[-.042,'#e7dcc6',.006],[-.025,'#bfaf94',.003]]){
    const outer=side*(1+margin);
    const corners=[[0,-.69-margin],[outer,-.69-margin],[outer,.69+margin],[0,.69+margin]];
    ctx.beginPath();
    corners.forEach(([x,y],i)=>{const point=project(x,y,z);if(i)ctx.lineTo(...point);else ctx.moveTo(...point)});
    ctx.closePath();ctx.fillStyle=color;ctx.fill();
   }
  }
  flat(paper(0),1,-.014);
  if(open>.95){
   flat(paper(0),-1,-.035);
   flat(paper(Math.max(0,landed-1)),-1,0);
  }
  flat(paper(phase==='idle'?landed:0),1,0);
  if(open<.99){
   drawSheet(cv,(u,y)=>project(u*Math.cos(open*Math.PI),y,.015+u*Math.sin(open*Math.PI)),false);
  }
  if(!closing&&open>=.99){
   if(phase==='idle'&&collected>landed){
    next=collected-landed>4?collected:landed+1;
    phase=landed?'turn':'fly';since=now;sequence++;
   }
   const fast=collected-landed>1;
   if(phase==='turn'){
    const t=reduced?1:bounded((now-since)/(fast?260:500));
    drawSheet(paper(landed),(u,y)=>{
     const angle=Math.PI*ease(t)+.66*Math.sin(Math.PI*t)*(1-u);
     return project(u*Math.cos(angle),y,u*Math.sin(angle)+.025);
    });
    if(t>=1){phase='fly';since=now}
   }
   if(phase==='fly'){
    if(landed)flat(paper(landed),-1,.005);
    const t=reduced?1:bounded((now-since)/(fast?390:790));
    const left=1-ease(t),[ax,ay]=directions[(sequence-1)%directions.length];
    drawSheet(paper(next),(u,y)=>{
     const curl=(1-t)*2.55;
     const x=curl?Math.sin(curl*u)/curl:u;
     const z=curl?(1-Math.cos(curl*u))/curl:0;
     return project(x+left*(ax*2.55+y*.48),y+left*ay*1.95+Math.sin(t*Math.PI)*.13*u,z+left*.92+.012);
    });
    if(t>=1){landed=next;phase='idle'}
   }
  }

  raf=requestAnimationFrame(frame);
 }
 frame(started);
 return {update(count,title,message){
  collected=Math.max(collected,count||0);
  el('bindCount').textContent=collected+' / '+total+' 章';
  if(!cancel.disabled)el('bindPhase').textContent=message||title||'正在装订';
 },async finish(saved){
  cancel.disabled=true;
  try{
   if(saved&&!reduced){
    // Only the newest pending chapter needs to land during the final flourish.
    if(collected-landed>1){landed=Math.max(landed,collected-1);phase='idle'}
    const deadline=performance.now()+2300;
    while(landed<collected&&performance.now()<deadline&&!document.hidden)
     await new Promise(resolve=>setTimeout(resolve,45));
    closing=performance.now();el('bindPhase').textContent='已保存 EPUB';
    if(!document.hidden)await new Promise(resolve=>setTimeout(resolve,875));
   }
  }finally{
   cancelAnimationFrame(raf);scene.hidden=true;shell.inert=false;
   document.body.classList.remove('binding');
  }
 }};
}
el('export').onclick=async()=>{
 busy=true;sync();const total=chosen.size;let binding;
 bookProgress(0,0,'等待选择保存位置');el('cancel').hidden=false;msg('');
 const stop=poll(()=>pywebview.api.progress(),v=>{
  if(v.kind!=='export'||!v.chapter)return;
  binding??=bindBook(total);
  binding.update(v.collected,v.last_title,v.chapter);
  bookProgress(v.collected,total,v.done===total?'正在写入电子书':'正在下载章节');
  msg(v.chapter)
 });
 let saved=false;
 try{
  const res=await pywebview.api.export(ttl.value.trim(),auth.value.trim(),[...chosen],cv.toDataURL().split(',')[1],Object.fromEntries([...chosen].map(i=>[i,book.chapters[i].name])));
  if(res.error)throw Error(res.error);
  saved=Boolean(res.path);if(saved){binding??=bindBook(total);binding.update(total,book.chapters[Math.max(...chosen)].name);bookProgress(total,total,'已保存 EPUB')}
  if(saved){
   const chapters=[...new Set(res.missing)];
   const warning=chapters.length?'；'+res.missing.length+' 处插图未能下载（'+chapters.slice(0,3).join('、')+(chapters.length>3?' 等':'')+'）':'';
   msg('已保存至 '+res.path+(res.images?' · 已嵌入 '+res.images+' 张插图':'')+warning,Boolean(warning))
  }else msg('已取消导出。')
 }catch(err){msg(err.message,true)}
 finally{stop();el('cancel').hidden=true;try{await binding?.finish(saved)}finally{busy=false;el('bookMeter').hidden=!saved;sync()}}
};
let checking=false, downloading=false, newVersion='';
async function checkUpdates(manual){
 if(checking||downloading)return;
 checking=true;el('update').disabled=true;
 try{const info=await pywebview.api.check_updates();if(manual||info.version){
 newVersion=info.version||'';el('getRelease').textContent=info.restart?'更新并重启':'下载并打开安装向导';el('releaseText').textContent=info.message;el('getRelease').hidden=!newVersion;el('release').hidden=false}}
 finally{checking=false;el('update').disabled=false}
}
el('update').onclick=()=>checkUpdates(true);
el('dismissRelease').onclick=()=>el('release').hidden=true;
el('getRelease').onclick=async()=>{
 if(busy||downloading)return;
 if(book&&el('getRelease').textContent==='更新并重启'&&!confirm('更新将关闭当前制书工作台。确认已导出需要保留的编辑，并重启拾卷？'))return;
 busy=downloading=true;sync();
 for(const k of ['update','getRelease','dismissRelease'])el(k).disabled=true;
 const bar=el('releaseBar');bar.removeAttribute('value');el('releaseNumbers').textContent='';
 el('releaseMeter').hidden=false;el('releaseText').textContent='正在查询安装包…';
 const stop=poll(()=>pywebview.api.update_progress(),v=>{
  el('releaseText').textContent=v.phase;
  if(v.total){bar.max=v.total;bar.value=v.bytes;
   const mib=n=>(n/1048576).toFixed(2);
   el('releaseNumbers').textContent=mib(v.bytes)+' / '+mib(v.total)+' MiB · '+Math.floor(100*v.bytes/v.total)+'%'}
 });
 try{el('releaseText').textContent=await pywebview.api.download_update(newVersion)}
 catch(e){el('releaseText').textContent=e.message}
 finally{stop();busy=downloading=false;el('releaseMeter').hidden=true;
  for(const k of ['update','getRelease','dismissRelease'])el(k).disabled=false;sync()}
};
