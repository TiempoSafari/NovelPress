<!DOCTYPE html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>拾卷</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f4;color:#23372f;font:14px/1.5 "Microsoft YaHei UI","Microsoft YaHei",sans-serif}header{height:68px;padding:0 32px;display:flex;align-items:center;gap:13px;background:#fcfcf8;border-bottom:1px solid #d9ded6}header strong{font:700 27px SimSun,serif;letter-spacing:.1em}header span{border-left:1px solid #cbd2ca;padding-left:15px;color:#536559}.mark{width:31px;height:31px;background:#214f42;color:white;display:grid;place-items:center;border-radius:3px;font:21px SimSun,serif}.shell{display:grid;grid-template-columns:275px minmax(0,1fr);min-height:calc(100vh - 68px)}aside{padding:25px 26px;background:#edf1e9;border-right:1px solid #d9ded6}h1,h2,p{margin:0}h1{font:700 28px/1.5 SimSun,serif}h2{font-size:16px;font-weight:600}.poster{background:#dbe3d8;display:grid;place-items:center;padding:20px 15px;margin:14px 0 18px;border-radius:4px}canvas{width:146px;max-width:100%;height:auto;box-shadow:4px 5px 0 #bbc8bb}.field{display:block;margin:12px 0 5px;color:#425449;font-size:13px}input[type=text],input[type=url]{width:100%;border:1px solid #c1ccc1;border-radius:5px;background:#fffefa;color:#23372f;font:inherit;padding:9px 11px}input:focus,button:focus-visible{outline:2px solid #387760;outline-offset:2px}input[type=checkbox]{accent-color:#28614b;width:16px;height:16px}.meta{margin-top:24px;border-top:1px solid #cdd5ca;padding-top:11px;color:#506156;display:flex;justify-content:space-between;font-size:12px}.meta b{font-family:Georgia,serif;letter-spacing:.1em}.work{padding:24px clamp(22px,3vw,45px);display:flex;flex-direction:column;gap:22px;min-width:0}.hint,.small{color:#56665a;font-size:13px}.origin{background:#fffefa;padding:18px 20px;border:1px solid #d5dcd1;border-radius:6px}.origin label{font-weight:600}.urlrow,.actions,.bar,.bottom{display:flex;align-items:center;gap:9px}.urlrow{margin-top:9px}.urlrow input{min-width:0}.hint{margin-top:8px}.example{background:none;border:0;border-radius:0;padding:0 2px;color:#28634a;text-decoration:underline;text-underline-offset:3px;font:inherit}button{cursor:pointer;white-space:nowrap;border:1px solid #bac7bd;background:#fffefa;border-radius:5px;color:#263c31;padding:9px 15px;font:600 14px "Microsoft YaHei UI",sans-serif}button:hover{background:#e8eee7}button:disabled{cursor:default;opacity:.53}.primary{background:#225442;border-color:#225442;color:white}.primary:hover{background:#173e30}.bar,.bottom{justify-content:space-between}.bar{padding-bottom:12px;border-bottom:1px solid #cfd8ce}.plain{border:0;background:none;padding:5px 7px;font-size:13px;color:#345d49}.toc{flex:1;display:flex;flex-direction:column;min-height:150px}.rows{flex:1;max-height:clamp(180px,40vh,600px);overflow:auto}.row{display:flex;gap:12px;align-items:center;min-height:41px;border-bottom:1px solid #dce2d7;padding:5px;cursor:pointer}.row span{overflow-wrap:anywhere}.num{font:13px Georgia;color:#627365}.empty{display:grid;place-content:center;justify-items:center;text-align:center;min-height:164px;height:100%;gap:5px}.empty strong{font-size:15px}.empty svg{margin-bottom:6px}.bottom{border-top:1px solid #cad4c9;padding-top:15px}.status{overflow-wrap:anywhere;color:#355341;font-size:13px;white-space:pre-line}.error{color:#993a29}progress{width:100%;height:7px;accent-color:#326a51}.actions{flex-shrink:0}button[hidden],progress[hidden]{display:none}@media(max-width:850px){.shell{grid-template-columns:215px minmax(0,1fr)}aside{padding:21px 16px}.work{padding:20px;gap:17px}.origin{padding:14px}.poster{padding:14px}.urlrow button{padding:10px}.bottom{align-items:flex-end}}
</style>
<header><div class="mark" aria-hidden="true">卷</div><strong>拾卷</strong><span>网页小说制书工具</span><button class="plain" style="margin-left:auto" id="update" disabled>检查更新</button><button class="plain" id="plugins">打开插件目录</button><button id="install" disabled>安装插件</button></header>
<div id="release" hidden role="status" style="padding:8px 32px;background:#e7ece3"><span id="releaseText"></span> <button id="getRelease" hidden>下载安装包</button> <button class="plain" id="dismissRelease">关闭</button></div><div class="shell"><aside><h2>书籍预览</h2><div class="poster"><canvas id="cover" width="540" height="756" aria-label="电子书封面预览"></canvas></div><label class="field" for="title">书名</label><input type="text" id="title" maxlength="180" placeholder="解析后自动填写"><label class="field" for="author">作者</label><input type="text" id="author" maxlength="120" placeholder="可选"><div class="meta"><span>电子书格式</span><b>EPUB 3</b></div></aside>
<main class="work"><h1>制书工作台</h1><form class="origin" id="form"><label for="url">小说网页</label><div class="urlrow"><input type="url" id="url" placeholder="https://…" required><button class="primary" id="inspect" disabled>解析网页</button></div><p class="hint">粘贴目录或正文网址，也可以<button type="button" class="example" id="example">试用《呐喊》</button>。</p><div id="unsupported" hidden role="alert" style="margin-top:12px"><strong id="reason"></strong> <button type="button" id="installHere">安装对应插件…</button></div></form>
<section class="toc"><div class="bar"><h2>章节目录</h2><div><button class="plain" id="all" disabled>全选</button><button class="plain" id="none" disabled>清空选择</button></div></div><div class="rows" id="rows"><div class="empty"><svg width="58" height="35" viewBox="0 0 58 35" fill="none" stroke="#6b8776" stroke-width="1.7" aria-hidden="true"><path d="M3 6q14-4 25 3 12-7 26-3v23q-14-4-26 2-12-6-25-2zM28 9v21M7 2q11-2 20 3m5 0q10-5 19-3"/></svg><strong>等待导入章节</strong><span class="small">解析网页后，在这里选择要收录的章节。</span></div></div></section>
<progress id="progress" hidden></progress><div class="bottom"><div><strong id="count">已选 0 章</strong><div class="status" role="status" id="status"></div></div><div class="actions"><button id="cancel" hidden>取消</button><button id="export" class="primary" disabled>导出 EPUB ↓</button></div></div></main></div>
<script>
const el=id=>document.getElementById(id), ttl=el('title'), auth=el('author'), url=el('url'), cv=el('cover');
let book=null,busy=false,chosen=new Set(),ready=false,loadedUrl='';
function cover(){
 const c=cv.getContext('2d'),w=cv.width,h=cv.height;c.fillStyle='#193f35';c.fillRect(0,0,w,h);
 c.strokeStyle='#90aa89';c.lineWidth=2;c.strokeRect(20,18,w-38,h-36);
 c.fillStyle='#112f27';c.fillRect(0,0,12,h);c.save();c.beginPath();c.rect(23,23,494,709);c.clip();
 c.fillStyle='#cfb77b';c.beginPath();c.arc(404,357,34,0,7);c.fill();
 for(let j=0;j<64;j++){c.beginPath();for(let x=0;x<=w;x+=3){let y=465+j*4.5+40*Math.sin(x/109+j*.047)+17*Math.cos(x/57-j*.03)+8*Math.sin(x/30+j*.016);if(x===0)c.moveTo(x,y);else c.lineTo(x,y)}c.strokeStyle=j%5===0?'#a2ad82':'#71947d';c.lineWidth=j%5===0?2:1.5;c.stroke()}c.restore();
 c.fillStyle='#f3edce';const name=ttl.value.trim()||'未题书稿';const letters=Array.from(name);const size=letters.length>13?41:57;c.font='bold '+size+'px SimSun,serif';let words='',y=123;
 for(const ch of letters){if(c.measureText(words+ch).width>422){c.fillText(words,50,y);words='';y+=size*1.23;if(y>285){words='…';break}}words+=ch}c.fillText(words,50,y);
 c.fillStyle='#d4dfc6';c.font='24px SimSun,serif';c.fillText(auth.value.trim()||'佚名',52,Math.min(y+65,363),405);
}
function msg(s='',error=false){el('status').textContent=s;el('status').classList.toggle('error',error)}
const initialRows=el("rows").innerHTML;
function sync(){el("install").disabled=busy||!ready;el("installHere").disabled=busy||!ready;let valid=book&&url.value.trim()===loadedUrl;
 el('count').textContent=book?'已选 '+chosen.size+' / '+book.chapters.length+' 章':'已选 0 章';
 el('export').disabled=busy||!valid||!chosen.size||!ttl.value.trim();el('inspect').disabled=busy||!ready;
 for(const key of ['all','none'])el(key).disabled=busy||!valid;
 el('example').disabled=busy||!ready;for(const box of [ttl,auth,url])box.disabled=busy;el('rows').inert=busy||!valid;
}
function render(){let frag=document.createDocumentFragment();book.chapters.forEach((ch,i)=>{let row=document.createElement('label');row.className='row';let cb=document.createElement('input');cb.type='checkbox';cb.checked=chosen.has(i);cb.onchange=()=>{cb.checked?chosen.add(i):chosen.delete(i);sync()};let no=document.createElement('small');no.className='num';no.textContent=String(i+1).padStart(2,'0');let name=document.createElement('span');name.textContent=ch.name;row.append(cb,no,name);frag.append(row)});el('rows').replaceChildren(frag);sync()}
for(const box of [ttl,auth])box.oninput=()=>{cover();sync()};url.oninput=()=>{el('unsupported').hidden=true;msg(book&&url.value.trim()!==loadedUrl?'网址已更改，请重新解析。':'');sync()};
async function installPlugin(){
 if(busy||!ready)return;
 busy=true;sync();let retry=false;
 try{const res=await pywebview.api.install_plugin();if(res.error)throw Error(res.error);
 if(!res.cancelled){msg('已安装 '+res.name+'（'+res.host+'）。');retry=!el('unsupported').hidden&&el('unsupported').dataset.host===res.host}}
 catch(err){msg(err.message,true)}finally{busy=false;sync()}
 if(retry)el('form').requestSubmit();
}
el('install').onclick=installPlugin;el('installHere').onclick=installPlugin;
el('plugins').onclick=async()=>{try{await pywebview.api.open_plugins()}catch(err){msg(err.message,true)}};
el('form').onsubmit=async e=>{e.preventDefault();if(busy||!ready)return;busy=true;book=null;chosen.clear();ttl.value='';auth.value='';cover();el('rows').innerHTML=initialRows;el('unsupported').hidden=true;sync();msg('正在读取网页…');el('cancel').hidden=false;let reading=true;const timer=setInterval(async()=>{let v=await pywebview.api.progress();if(reading&&v.chapter)msg(v.chapter)},450);try{const result=await pywebview.api.inspect(url.value.trim());if(result.unsupported){el('reason').textContent='不支持此网站 · '+result.unsupported;el('unsupported').dataset.host=result.unsupported;el('unsupported').hidden=false;msg('请选择该域名对应的 JSON 插件。');return}if(result.error)throw Error(result.error);book=result;loadedUrl=url.value.trim();ttl.value=book.title;auth.value=book.author;chosen=new Set(book.chapters.map((_,i)=>i));render();cover();msg(book.adapter?'已使用 '+book.adapter+' 插件。':book.chapters.length===1?'已识别 1 个条目，请核对书名和章节。':'目录已载入。')}catch(err){msg(err.message,true)}finally{reading=false;clearInterval(timer);el('cancel').hidden=true;busy=false;sync()}};
el('example').onclick=()=>{url.value='https://zh.wikisource.org/wiki/呐喊';el('form').requestSubmit()};
el('all').onclick=()=>{chosen=new Set(book.chapters.map((_,i)=>i));render()};el('none').onclick=()=>{chosen.clear();render()};
el('cancel').onclick=async()=>{await pywebview.api.cancel();msg('正在取消…')};
el('export').onclick=async()=>{busy=true;sync();const p=el('progress');p.hidden=false;p.value=0;p.max=chosen.size;el('cancel').hidden=false;msg('选择保存位置…');let timer=setInterval(async()=>{try{let v=await pywebview.api.progress();if(busy&&v.chapter){p.value=v.done;msg('正在收录 · '+v.chapter)}}catch{}},400);
 try{let res=await pywebview.api.export(ttl.value.trim(),auth.value.trim(),[...chosen],cv.toDataURL().split(',')[1]);if(res.error)throw Error(res.error);msg(res.path?'已保存至 '+res.path:'已取消导出。')}catch(err){msg(err.message,true)}finally{clearInterval(timer);busy=false;p.hidden=true;el('cancel').hidden=true;sync()}};
let checking=false, newVersion='';
async function checkUpdates(manual){
 if(checking)return;
 checking=true;el('update').disabled=true;
 try{const info=await pywebview.api.check_updates();if(manual||info.version){
 newVersion=info.version||'';el('releaseText').textContent=info.message;el('getRelease').hidden=!newVersion;el('release').hidden=false}}
 finally{checking=false;el('update').disabled=false}
}
el('update').onclick=()=>checkUpdates(true);
el('dismissRelease').onclick=()=>el('release').hidden=true;
el('getRelease').onclick=()=>pywebview.api.download_update(newVersion);
window.addEventListener('pywebviewready',()=>{ready=true;sync();checkUpdates(false);setInterval(()=>checkUpdates(false),12*60*60*1000)});cover();sync();
</script></html>
